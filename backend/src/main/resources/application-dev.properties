# Local run without MySQL: mvn spring-boot:run -Dspring-boot.run.profiles=dev
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/school-enterprise;MODE=MySQL;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.flyway.enabled=false
spring.h2.console.enabled=true

app.jwt.secret=please-change-this-demo-secret-key-to-a-long-random-value-1234567890
app.jwt.expiration-ms=86400000
app.auth.reset-email-enabled=${RESET_EMAIL_ENABLED:true}
app.auth.reset-url=http://localhost:5173/forgot-password
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

spring.jackson.serialization.fail-on-empty-beans=false
logging.level.com.schoolenterprise=INFO
