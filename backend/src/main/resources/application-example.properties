# Copy this file to application.properties and configure credentials via environment variables.
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/school_enterprise?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=true

# Set JWT_SECRET to a unique random value of at least 64 characters for HS512.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000
app.auth.reset-email-enabled=${RESET_EMAIL_ENABLED:true}
app.auth.reset-url=http://localhost:5173/forgot-password
# Comma-separated exact HTTPS frontend origins; wildcards are rejected.
app.cors.allowed-origin-patterns=${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}
# Configure SMTP before enabling reset email delivery.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.schoolenterprise=INFO
