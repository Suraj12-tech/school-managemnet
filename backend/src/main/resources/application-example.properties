# Copy this file to application.properties and change the password.
server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/school_enterprise?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=YOUR_MYSQL_PASSWORD

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.jackson.serialization.fail-on-empty-beans=false
spring.jpa.open-in-view=true

# Must be at least 64 characters for HS512
app.jwt.secret=please-change-this-demo-secret-key-to-a-long-random-value-1234567890
app.jwt.expiration-ms=86400000
app.auth.reset-email-enabled=${RESET_EMAIL_ENABLED:true}
app.auth.reset-url=http://localhost:5173/forgot-password
# Configure SMTP before enabling reset email delivery.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.com.schoolenterprise=INFO
